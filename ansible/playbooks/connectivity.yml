---
# Playbook FINO: solo dice "en estos hosts, ejecuta estos roles".
# La logica de verdad vive en el rol 'connectivity'.
- name: Conectividad con los nodos Proxmox
  hosts: proxmox_nodes
  gather_facts: false
  roles:
    - connectivity




# gather_facts: false → cuando el rol NO necesita info del host (como el ping). Más rápido.
# gather_facts: true (default) → cuando SÍ vas a decidir cosas según el host (OS, RAM, IP…).
#
