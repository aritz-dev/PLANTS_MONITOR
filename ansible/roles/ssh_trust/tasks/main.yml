---
# Rol 'ssh_trust': confianza SSH root<->root entre TODOS los nodos (malla completa).
# Solo modulos builtin: file, command, slurp, authorized_key, copy.
# Se ejecuta en los 3 nodos; cada uno acaba confiando en los otros dos (y en si mismo).

- name: Asegurar que existe /root/.ssh
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    mode: "0700"

- name: Generar la clave SSH de root si no existe
  ansible.builtin.command:
    cmd: ssh-keygen -t ed25519 -N "" -f /root/.ssh/id_ed25519
    creates: /root/.ssh/id_ed25519       # idempotente: si ya hay clave, no la regenera

- name: Leer la clave PUBLICA de root de este nodo
  ansible.builtin.slurp:
    src: /root/.ssh/id_ed25519.pub
  register: root_pubkey

- name: Autorizar la clave de CADA nodo en este nodo (malla todos-en-todos)
  ansible.builtin.authorized_key:
    user: root
    state: present
    key: "{{ hostvars[item].root_pubkey.content | b64decode }}"
  loop: "{{ groups['proxmox_nodes'] }}"
  # Gracias a la barrera de Ansible, el slurp ya corrio en TODOS los nodos antes de esto,
  # asi que hostvars[item].root_pubkey esta disponible para cada 'item'.

- name: No preguntar por la clave de host entre nodos (comodo para el lab)
  ansible.builtin.copy:
    dest: /root/.ssh/config
    mode: "0600"
    content: |
      Host 10.0.10.*
          StrictHostKeyChecking accept-new
