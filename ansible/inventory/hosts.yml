# Inventario: los 3 nodos Proxmox, accesibles via port-forward de VirtualBox.
# WSL -> <IP de Windows>:22XX -> (VirtualBox NAT) -> 10.0.10.1X:22
#
# windows_host: IP de tu PC vista desde WSL. AJUSTA si cambia (es DHCP).
#   - Confirmada funcionando: 192.168.1.141
#   - Alternativas si deja de ir: `ip route show default | awk '{print $3}'` (gateway WSL)
all:
  vars:
    windows_host: 192.168.1.141
  children:
    proxmox_nodes:
      hosts:
        nodo1:
          ansible_host: "{{ windows_host }}"
          ansible_port: 2211
          node_ip: 10.0.10.11
        nodo2:
          ansible_host: "{{ windows_host }}"
          ansible_port: 2212
          node_ip: 10.0.10.12
        nodo3:
          ansible_host: "{{ windows_host }}"
          ansible_port: 2213
          node_ip: 10.0.10.13
    lxc_nodes:
      hosts:
        lxc1: 
          ansible_host: "{{ windows_host }}"
          ansible_port: 2221
          node_ip: 10.0.10.21
        lxc2: 
          ansible_host: "{{ windows_host }}"
          ansible_port: 2222
          node_ip: 10.0.10.22
        lxc3: 
          ansible_host: "{{ windows_host }}"
          ansible_port: 2223
          node_ip: 10.0.10.23